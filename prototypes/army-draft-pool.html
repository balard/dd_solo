<!doctype html>
<!--
  Feature sketch, not shipped code: a static, standalone page for visualizing one possible
  "progressive army building" pool. Open it directly (double-click, or file://) -- no build step,
  no server. Not part of `npm run build`'s entry points and not referenced from index.html, so it
  never ships in dist/. The unit/dragon/terrain data below is a hand-copied snapshot of
  data/starter/{units,terrains,dragons}.json (small/medium/large sizes only) -- re-copy it if that
  data changes; this file is not regenerated by `npm run data`.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army Draft Pool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f6f2ea;
    --surface: #ffffff;
    --surface-2: #ece4d4;
    --border: #ddd2ba;
    --text: #241f18;
    --text-dim: #786d5b;
    --accent: #5b3f8f;
    --accent-ink: #ffffff;
    --accent-soft: #ece5f9;
    --shadow: rgba(36, 31, 24, 0.10);
    --air: #3f7fc1;
    --earth: #a8762c;
    --fire: #c1502f;
    --water: #2f9184;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17151c;
      --surface: #211e29;
      --surface-2: #2a2734;
      --border: #3c3748;
      --text: #f1ecf7;
      --text-dim: #a79cc0;
      --accent: #a688ef;
      --accent-ink: #17151c;
      --accent-soft: #2c2440;
      --shadow: rgba(0, 0, 0, 0.45);
      --air: #74aae4;
      --earth: #d3a05a;
      --fire: #e88564;
      --water: #57c0b1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17151c;
    --surface: #211e29;
    --surface-2: #2a2734;
    --border: #3c3748;
    --text: #f1ecf7;
    --text-dim: #a79cc0;
    --accent: #a688ef;
    --accent-ink: #17151c;
    --accent-soft: #2c2440;
    --shadow: rgba(0, 0, 0, 0.45);
    --air: #74aae4;
    --earth: #d3a05a;
    --fire: #e88564;
    --water: #57c0b1;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    padding-inline: 20px;
    padding-block: 28px 60px;
  }
  .page { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  .top-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .race-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-weight: 600;
    font-size: 13.5px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .race-pill .dots { display: flex; gap: 4px; }
  .race-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

  .reroll-btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 1px 2px var(--shadow);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .reroll-btn:hover { filter: brightness(1.08); }
  .reroll-btn:active { transform: translateY(1px); }
  .reroll-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .reroll-btn svg { width: 14px; height: 14px; }

  .pool-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px 24px;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .section-head h2 {
    font-family: "Cinzel", Georgia, serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  .section-note {
    margin: 0;
    font-size: 12px;
    color: var(--text-dim);
  }

  .tile-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 22px 16px;
  }

  .piece {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    width: 92px;
    animation: pieceIn 0.4s ease both;
  }
  @keyframes pieceIn {
    from { opacity: 0; transform: translateY(7px) scale(0.93); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .piece { animation: none !important; }
  }

  .tile {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px var(--shadow);
  }
  .tile--unit, .tile--dragon { border-radius: 15px; }
  .tile--terrain { border-radius: 6px; }
  .tile--small { width: 58px; height: 58px; }
  .tile--medium { width: 68px; height: 68px; }
  .tile--large { width: 78px; height: 78px; }
  .tile--dragon { width: 88px; height: 88px; }
  .tile--terrain { width: 76px; height: 76px; }

  .tile-icon { width: 46%; height: 46%; color: var(--text-dim); }
  .tile-icon svg { width: 100%; height: 100%; }
  .tile-eighth {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: lowercase;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.25;
    padding: 0 6px;
  }

  .tile-step {
    position: absolute;
    top: 5px;
    left: 6px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 9px;
    color: var(--text-dim);
    opacity: 0.65;
  }
  .tile-health {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
  }
  .tile-dots {
    position: absolute;
    bottom: 7px;
    display: flex;
    gap: 4px;
  }
  .tile-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

  .piece-name {
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    line-height: 1.25;
  }
  .piece-meta {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
  }

</style>
</head>
<body>

<div class="page">
  <div class="top-row">
    <div class="race-pill" id="racePill"></div>
    <button class="reroll-btn" id="rerollBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
      Reroll pool
    </button>
  </div>

  <section class="pool-section" aria-labelledby="unitsHeading">
    <div class="section-head">
      <h2 id="unitsHeading">Units</h2>
      <p class="section-note">large &rarr; medium (same type) &rarr; medium (different type) &rarr; all 5 smalls</p>
    </div>
    <div class="tile-row" id="unitsRow"></div>
  </section>

  <section class="pool-section" aria-labelledby="dragonHeading">
    <div class="section-head">
      <h2 id="dragonHeading">Dragon</h2>
      <p class="section-note">one, in a color the race can cast</p>
    </div>
    <div class="tile-row" id="dragonRow"></div>
  </section>

  <section class="pool-section" aria-labelledby="terrainHeading">
    <div class="section-head">
      <h2 id="terrainHeading">Terrains</h2>
      <p class="section-note">two eighth-face variants of the race's own home terrain type</p>
    </div>
    <div class="tile-row" id="terrainRow"></div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var DATA = {"species":{"treefolk":{"name":"Treefolk","elements":["water","earth"]},"firewalkers":{"name":"Firewalkers","elements":["air","fire"]}},"units":[{"id":"treefolk.oakling","name":"Oakling","species":"treefolk","class":"heavy_melee","size":"small","health":1},{"id":"treefolk.oak","name":"Oak","species":"treefolk","class":"heavy_melee","size":"medium","health":2},{"id":"treefolk.oak_lord","name":"Oak Lord","species":"treefolk","class":"heavy_melee","size":"large","health":3},{"id":"treefolk.willowling","name":"Willowling","species":"treefolk","class":"light_melee","size":"small","health":1},{"id":"treefolk.willow","name":"Willow","species":"treefolk","class":"light_melee","size":"medium","health":2},{"id":"treefolk.noble_willow","name":"Noble Willow","species":"treefolk","class":"light_melee","size":"large","health":3},{"id":"treefolk.nymph","name":"Nymph","species":"treefolk","class":"cavalry","size":"small","health":1},{"id":"treefolk.naiad","name":"Naiad","species":"treefolk","class":"cavalry","size":"medium","health":2},{"id":"treefolk.lady_nereid","name":"Lady Nereid","species":"treefolk","class":"cavalry","size":"large","health":3},{"id":"treefolk.pineling","name":"Pineling","species":"treefolk","class":"missile","size":"small","health":1},{"id":"treefolk.pine","name":"Pine","species":"treefolk","class":"missile","size":"medium","health":2},{"id":"treefolk.pine_prince","name":"Pine Prince","species":"treefolk","class":"missile","size":"large","health":3},{"id":"treefolk.hamadryad","name":"Hamadryad","species":"treefolk","class":"magic","size":"small","health":1},{"id":"treefolk.dryad","name":"Dryad","species":"treefolk","class":"magic","size":"medium","health":2},{"id":"treefolk.eldar_dryad","name":"Eldar Dryad","species":"treefolk","class":"magic","size":"large","health":3},{"id":"firewalkers.guardian","name":"Guardian","species":"firewalkers","class":"heavy_melee","size":"small","health":1},{"id":"firewalkers.watcher","name":"Watcher","species":"firewalkers","class":"heavy_melee","size":"medium","health":2},{"id":"firewalkers.sentinel","name":"Sentinel","species":"firewalkers","class":"heavy_melee","size":"large","health":3},{"id":"firewalkers.explorer","name":"Explorer","species":"firewalkers","class":"light_melee","size":"small","health":1},{"id":"firewalkers.adventurer","name":"Adventurer","species":"firewalkers","class":"light_melee","size":"medium","health":2},{"id":"firewalkers.expeditioner","name":"Expeditioner","species":"firewalkers","class":"light_melee","size":"large","health":3},{"id":"firewalkers.shadowchaser","name":"Shadowchaser","species":"firewalkers","class":"cavalry","size":"small","health":1},{"id":"firewalkers.nightsbane","name":"Nightsbane","species":"firewalkers","class":"cavalry","size":"medium","health":2},{"id":"firewalkers.daybringer","name":"Daybringer","species":"firewalkers","class":"cavalry","size":"large","health":3},{"id":"firewalkers.firestarter","name":"Firestarter","species":"firewalkers","class":"missile","size":"small","health":1},{"id":"firewalkers.firemaster","name":"Firemaster","species":"firewalkers","class":"missile","size":"medium","health":2},{"id":"firewalkers.firestormer","name":"Firestormer","species":"firewalkers","class":"missile","size":"large","health":3},{"id":"firewalkers.sunburst","name":"Sunburst","species":"firewalkers","class":"magic","size":"small","health":1},{"id":"firewalkers.sunflare","name":"Sunflare","species":"firewalkers","class":"magic","size":"medium","health":2},{"id":"firewalkers.ashbringer","name":"Ashbringer","species":"firewalkers","class":"magic","size":"large","health":3}],"terrainTypes":{"swampland":{"name":"Swampland","elements":["water","earth"]},"highland":{"name":"Highland","elements":["fire","earth"]},"wasteland":{"name":"Wasteland","elements":["air","fire"]},"coastland":{"name":"Coastland","elements":["air","water"]},"feyland":{"name":"Feyland","elements":["water","fire"]},"flatland":{"name":"Flatland","elements":["air","earth"]}},"terrains":[{"id":"swampland_tower","type":"swampland","eighthFace":"tower"},{"id":"swampland_city","type":"swampland","eighthFace":"city"},{"id":"swampland_standing_stones","type":"swampland","eighthFace":"standing_stones"},{"id":"swampland_temple","type":"swampland","eighthFace":"temple"},{"id":"highland_tower","type":"highland","eighthFace":"tower"},{"id":"highland_city","type":"highland","eighthFace":"city"},{"id":"highland_standing_stones","type":"highland","eighthFace":"standing_stones"},{"id":"highland_temple","type":"highland","eighthFace":"temple"},{"id":"wasteland_tower","type":"wasteland","eighthFace":"tower"},{"id":"wasteland_city","type":"wasteland","eighthFace":"city"},{"id":"wasteland_standing_stones","type":"wasteland","eighthFace":"standing_stones"},{"id":"wasteland_temple","type":"wasteland","eighthFace":"temple"},{"id":"coastland_tower","type":"coastland","eighthFace":"tower"},{"id":"coastland_city","type":"coastland","eighthFace":"city"},{"id":"coastland_standing_stones","type":"coastland","eighthFace":"standing_stones"},{"id":"coastland_temple","type":"coastland","eighthFace":"temple"},{"id":"feyland_tower","type":"feyland","eighthFace":"tower"},{"id":"feyland_city","type":"feyland","eighthFace":"city"},{"id":"feyland_standing_stones","type":"feyland","eighthFace":"standing_stones"},{"id":"feyland_temple","type":"feyland","eighthFace":"temple"},{"id":"flatland_tower","type":"flatland","eighthFace":"tower"},{"id":"flatland_city","type":"flatland","eighthFace":"city"},{"id":"flatland_standing_stones","type":"flatland","eighthFace":"standing_stones"},{"id":"flatland_temple","type":"flatland","eighthFace":"temple"}],"dragons":[{"id":"air_drake","element":"air","form":"drake"},{"id":"air_wyrm","element":"air","form":"wyrm"},{"id":"death_drake","element":"death","form":"drake"},{"id":"death_wyrm","element":"death","form":"wyrm"},{"id":"earth_drake","element":"earth","form":"drake"},{"id":"earth_wyrm","element":"earth","form":"wyrm"},{"id":"fire_drake","element":"fire","form":"drake"},{"id":"fire_wyrm","element":"fire","form":"wyrm"},{"id":"water_drake","element":"water","form":"drake"},{"id":"water_wyrm","element":"water","form":"wyrm"}]};

  var CLASS_ORDER = ["heavy_melee", "light_melee", "cavalry", "missile", "magic"];
  var CLASS_BADGE = { heavy_melee: "HM", light_melee: "LM", cavalry: "CA", missile: "MI", magic: "MA" };
  var SIZE_LABEL = { small: "Small", medium: "Medium", large: "Large" };
  var EIGHTH_BADGE = { tower: "TW", city: "CT", standing_stones: "SS", temple: "TP" };
  var ELEMENT_LABEL = { air: "Air", earth: "Earth", fire: "Fire", water: "Water", death: "Death" };

  // Each class's dominant result icon among its small/medium/large faces in the real
  // data (heavy/light melee -> MELEE, cavalry -> MANEUVER, missile -> MISSILE,
  // magic -> MAGIC). The SVGs themselves are copied from src/ui/game/Glyph.tsx's
  // `PATHS`, not redrawn, so a tile's icon is a real face icon rather than an
  // invented one.
  var CLASS_ICON = {
    heavy_melee: "MELEE",
    light_melee: "MELEE",
    cavalry: "MANEUVER",
    missile: "MISSILE",
    magic: "MAGIC"
  };

  var ICONS = {
    // A ring around a dot: this die, being itself.
    ID: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>',
    // A blade with a crossguard.
    MELEE: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 L12 16"/><path d="M8 8.5 L16 8.5"/><path d="M9.5 16 L14.5 16 L12 20.5 Z"/></svg>',
    // An arrow in flight.
    MISSILE: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5 L19 5"/><path d="M13 5 L19 5 L19 11"/><path d="M4.5 19.5 L9 18 L6 15 Z"/></svg>',
    // A six-point burst.
    MAGIC: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 L12 21.5"/><path d="M4 7 L20 17"/><path d="M20 7 L4 17"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>',
    // Chevrons: moving the terrain.
    MANEUVER: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14.5 L12 7.5 L19 14.5"/><path d="M5 19 L12 12 L19 19"/></svg>',
    // Open jaws seen side-on: the dragon's heaviest face, and the mark the board
    // itself uses for "a dragon is standing here".
    JAWS: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 C7 5 14 5 20.5 8.5"/><path d="M3 16.5 C7 19 14 19 20.5 15.5"/><path d="M7 6.6 L8.6 10"/><path d="M12 6.2 L13.6 9.6"/><path d="M7 17.4 L8.6 14"/><path d="M12 17.8 L13.6 14.4"/></svg>'
  };

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function sameElements(a, b) {
    var sa = a.slice().sort().join(",");
    var sb = b.slice().sort().join(",");
    return sa === sb;
  }
  function dotsHtml(elements) {
    return elements.map(function (e) {
      return '<span class="dot" style="--c:var(--' + e + ')"></span>';
    }).join("");
  }

  function buildPool() {
    var raceKey = pick(Object.keys(DATA.species));
    var race = DATA.species[raceKey];
    var raceUnits = DATA.units.filter(function (u) { return u.species === raceKey; });

    var large = pick(raceUnits.filter(function (u) { return u.size === "large"; }));
    var sameMedium = raceUnits.filter(function (u) { return u.size === "medium" && u.class === large.class; })[0];
    var otherMediums = raceUnits.filter(function (u) { return u.size === "medium" && u.class !== large.class; });
    var otherMedium = pick(otherMediums);
    var smalls = raceUnits.filter(function (u) { return u.size === "small"; }).slice().sort(function (a, b) {
      return CLASS_ORDER.indexOf(a.class) - CLASS_ORDER.indexOf(b.class);
    });

    var dragonElement = pick(race.elements);
    var dragonForm = pick(["drake", "wyrm"]);
    var dragon = DATA.dragons.filter(function (d) { return d.element === dragonElement && d.form === dragonForm; })[0];

    var terrainTypeKey = Object.keys(DATA.terrainTypes).filter(function (key) {
      return sameElements(DATA.terrainTypes[key].elements, race.elements);
    })[0];
    var variants = DATA.terrains.filter(function (t) { return t.type === terrainTypeKey; });
    var shuffled = variants.slice().sort(function () { return Math.random() - 0.5; });
    var terrains = shuffled.slice(0, 2);

    return {
      raceKey: raceKey,
      race: race,
      units: [large, sameMedium, otherMedium].concat(smalls),
      dragon: dragon,
      terrainType: DATA.terrainTypes[terrainTypeKey],
      terrains: terrains
    };
  }

  function unitTile(u, index) {
    return (
      '<div class="piece" style="animation-delay:' + (index * 65) + 'ms">' +
        '<div class="tile tile--unit tile--' + u.size + '">' +
          '<span class="tile-step">' + (index + 1) + '</span>' +
          '<span class="tile-health">' + u.health + '</span>' +
          '<span class="tile-icon">' + ICONS[CLASS_ICON[u.class]] + '</span>' +
          '<span class="tile-dots">' + dotsHtml(DATA.species[u.species].elements) + '</span>' +
        '</div>' +
        '<span class="piece-name">' + u.name + '</span>' +
        '<span class="piece-meta">' + CLASS_BADGE[u.class] + ' &middot; ' + SIZE_LABEL[u.size] + '</span>' +
      '</div>'
    );
  }

  function dragonTile(d, index) {
    var name = ELEMENT_LABEL[d.element] + " " + (d.form === "drake" ? "Drake" : "Wyrm");
    var badge = d.form === "drake" ? "DK" : "WM";
    return (
      '<div class="piece" style="animation-delay:' + (index * 65) + 'ms">' +
        '<div class="tile tile--dragon">' +
          '<span class="tile-icon">' + ICONS.JAWS + '</span>' +
          '<span class="tile-dots">' + dotsHtml([d.element]) + '</span>' +
        '</div>' +
        '<span class="piece-name">' + name + '</span>' +
        '<span class="piece-meta">' + badge + '</span>' +
      '</div>'
    );
  }

  function terrainTile(t, typeElements, index) {
    var typeName = t.type.charAt(0).toUpperCase() + t.type.slice(1);
    // The real board has no glyph for an eighth-face icon -- only real art or, absent
    // it, the plain name (Board.tsx's `.chip-eighth` fallback). Matched here rather
    // than inventing a Tower/City/Temple glyph that exists nowhere in the app.
    return (
      '<div class="piece" style="animation-delay:' + (index * 65) + 'ms">' +
        '<div class="tile tile--terrain">' +
          '<span class="tile-eighth">' + t.eighthFace.replace(/_/g, " ") + '</span>' +
          '<span class="tile-dots">' + dotsHtml(typeElements) + '</span>' +
        '</div>' +
        '<span class="piece-name">' + typeName + '</span>' +
        '<span class="piece-meta">' + EIGHTH_BADGE[t.eighthFace] + '</span>' +
      '</div>'
    );
  }

  function render() {
    var pool = buildPool();

    document.getElementById("racePill").innerHTML =
      pool.race.name + '<span class="dots">' + dotsHtml(pool.race.elements) + '</span>';

    document.getElementById("unitsRow").innerHTML = pool.units.map(unitTile).join("");
    document.getElementById("dragonRow").innerHTML = dragonTile(pool.dragon, 0);
    document.getElementById("terrainRow").innerHTML = pool.terrains.map(function (t, i) {
      return terrainTile(t, pool.terrainType.elements, i);
    }).join("");
  }

  document.getElementById("rerollBtn").addEventListener("click", render);
  render();
})();
</script>
</body>
</html>
